{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Meal Buddy</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .bg-image {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url("{% static 'images/background.png' %}");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .checkout-container {
            padding: 2rem;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 1rem;
        }
        h2 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 2.5rem;
        }
        .error-message {
            color: #ff4d4d;
            font-size: 1.25rem;
            font-weight: 400;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="checkout-container">
            <h1>Checkout</h1>
            <h2>Welcome, {{ username }}</h2>
            <p class="error-message">
                Payment service is currently unreachable. Please check your internet/proxy settings and try again.
            </p>
        </div>
    </div>
</body>
</html>
