{% extends 'base.html' %}

{% block title %}Add Restaurant - Meal Buddy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="text-center mb-4">Add New Restaurant</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Restaurant Name</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="e.g. Tasty Bites" required>
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" id="location" placeholder="e.g. New York, NY" required>
                </div>
                <div class="mb-3">
                    <label for="cuisine_type" class="form-label">Cuisine Type</label>
                    <input type="text" name="cuisine_type" class="form-control" id="cuisine_type" placeholder="e.g. Italian, Chinese" required>
                </div>
                <div class="mb-3">
                    <label for="meal_name" class="form-label">Special Meal</label>
                    <input type="text" name="meal_name" class="form-control" id="meal_name" placeholder="e.g. Pepperoni Pizza" required>
                </div>
                <div class="mb-3">
                    <label for="cost" class="form-label">Meal Cost ($)</label>
                    <input type="number" step="0.01" name="cost" class="form-control" id="cost" placeholder="e.g. 15.50" required>
                </div>
                <div class="mb-3">
                    <label for="rating" class="form-label">Rating (1-5)</label>
                    <input type="number" name="rating" min="1" max="5" class="form-control" id="rating" placeholder="5" required>
                </div>
                <div class="mb-3">
                    <label for="logo_url" class="form-label">Restaurant Logo URL</label>
                    <input type="url" name="logo_url" class="form-control" id="logo_url" placeholder="e.g. logo.png">
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" name="is_veg" class="form-check-input" id="is_veg" checked>
                    <label class="form-check-label" for="is_veg">Is Vegetarian?</label>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Add Restaurant</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-light">Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
