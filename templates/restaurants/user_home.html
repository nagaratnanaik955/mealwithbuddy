{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Meal Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Outfit', sans-serif; }
        .bg-image { background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url("{% static 'images/background.png' %}"); height: 100%; background-position: center; background-repeat: no-repeat; background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 2rem; color: #000; }
        .btn-custom { padding: 0.6rem 2.5rem; font-size: 1rem; font-weight: 700; border-radius: 0.3rem; margin-bottom: 1rem; text-transform: uppercase; width: 250px; background-color: #3b82f6; border: none; color: white; display: block; }
        .btn-custom:hover { background-color: #2563eb; color: white; }
        .btn-container { display: flex; flex-direction: column; align-items: center; }
        .logout-link { position: absolute; top: 20px; right: 20px; }
    </style>
</head>
<body>
    <div class="bg-image">
        <form action="{% url 'logout' %}" method="post" class="logout-link">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-link text-decoration-none text-dark fw-bold">Logout</button>
        </form>
        
        <h1>Welcome {{ user.username }}!</h1>
        
        <div class="btn-container">
            <a href="{% url 'view_restaurants' %}" class="btn-custom">VIEW RESTAURANTS</a>
            <a href="{% url 'view_cart' username=user.username %}" class="btn-custom">VIEW CART</a>
        </div>
    </div>
</body>
</html>
