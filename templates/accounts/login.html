{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Meal Buddy</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .bg-image {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url("{% static 'images/background.png' %}");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-title {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #333;
            text-transform: uppercase;
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .form-label {
            font-weight: 700;
            color: #444;
            margin-bottom: 0.5rem;
        }
        .form-control {
            background-color: #f0f4f9;
            border: 1px solid #d1d9e6;
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(0, 153, 255, 0.1);
            border-color: #0099ff;
        }
        .btn-signin {
            background-color: #0099ff;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 700;
            color: white;
            border-radius: 0.5rem;
            text-transform: uppercase;
        }
        .btn-signin:hover {
            background-color: #007acc;
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <h2 class="login-title">SIGN IN below:</h2>
        <div class="login-card">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} p-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                </div>
                
                <div class="mb-4">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                
                <div class="text-start">
                    <button type="submit" class="btn btn-signin">SIGN IN</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <p class="small text-muted">Don't have an account? <a href="{% url 'signup' %}" class="text-primary text-decoration-none fw-bold">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
