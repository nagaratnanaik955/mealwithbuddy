{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Meal Buddy</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .bg-image {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url("{% static 'images/background.png' %}");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #000;
        }
        .btn-custom {
            padding: 0.6rem 2.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 0.3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            width: 180px;
            background-color: #0099ff;
            border: none;
            color: white;
            display: block;
        }
        .btn-custom:hover {
            background-color: #007acc;
            color: white;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <h1>Welcome to Meal Buddy!</h1>
        <div class="btn-container">
            <a href="{% url 'signup' %}" class="btn-custom">ADMIN SIGN UP</a>
            <a href="{% url 'login' %}" class="btn-custom">USER SIGN IN</a>
        </div>
    </div>
</body>
</html>
